name: AI PR Review

on: [pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate AI review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/ai-review.mjs

      - name: Post AI review comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
        if: always()
        run: gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/ai-review.md"
        shell: bash
      - name: Mark blocking issues
        if: always()
        run: |
          if jq -e 'any(.issues[]?; ((.severity // "") | ascii_downcase) == "critical" or ((.severity // "") | ascii_downcase) == "blocking")' "$RUNNER_TEMP/ai-review.json" >/dev/null; then
            echo "::warning title=AI review::AI found critical or blocking issues. Manual confirmation is required."
          fi
        shell: bash
