name: AI PR Review

on: [pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    # 兜住脚本内部超时也失灵的情况，避免 job 默认挂满 6 小时。
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate AI review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_API_BASE_URL: ${{ vars.AI_API_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          # 用 PR 的 base sha 而不是 HEAD~1，多提交的 PR 才会审到完整改动。
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AI_MAX_DIFF_CHARS: ${{ vars.AI_MAX_DIFF_CHARS }}
          AI_TIMEOUT_MS: ${{ vars.AI_TIMEOUT_MS }}
          AI_PREFLIGHT: ${{ vars.AI_PREFLIGHT }}
          AI_REVIEW_STRICT: ${{ vars.AI_REVIEW_STRICT }}
        run: node scripts/ai-review.mjs

      # 审查未能产出时脚本会自己写一份“未运行”的说明；只有连这份都没有才跳过。
      - name: Post AI review comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
        shell: bash
        run: |
          if [ ! -s "$RUNNER_TEMP/ai-review.md" ]; then
            echo "::warning title=AI review::没有生成审查评论，跳过评论。"
            exit 0
          fi
          gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/ai-review.md"

      - name: Mark blocking issues
        if: always()
        shell: bash
        run: |
          if [ ! -s "$RUNNER_TEMP/ai-review.json" ]; then
            echo "::warning title=AI review::没有生成审查结果，跳过阻塞项检查。"
            exit 0
          fi

          if jq -e 'any(.issues[]?; ((.severity // "") | ascii_downcase) == "critical" or ((.severity // "") | ascii_downcase) == "blocking")' "$RUNNER_TEMP/ai-review.json" >/dev/null; then
            echo "::warning title=AI review::AI found critical or blocking issues. Manual confirmation is required."
          fi
