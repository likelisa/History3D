<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">张骞出使月氏文本顺序示意</title>
  <desc id="desc">大宛、康居、大月氏、大夏依古籍叙事顺序排列；不表达真实方位、距离或道路。</desc>
  <rect width="1200" height="250" fill="#f5f0e8"/>
  <text x="40" y="42" font-family="sans-serif" font-size="25" fill="#302e2b">古籍叙事顺序示意 · 非地理地图</text>
  <g font-family="sans-serif" font-size="28" text-anchor="middle" fill="#2b2926">
    <rect x="40" y="83" width="235" height="77" rx="11" fill="#e7d6b5"/><text x="157" y="130">大宛</text>
    <rect x="334" y="83" width="235" height="77" rx="11" fill="#e7d6b5"/><text x="451" y="130">康居</text>
    <rect x="628" y="83" width="235" height="77" rx="11" fill="#d2e0dc"/><text x="745" y="130">大月氏</text>
    <rect x="922" y="83" width="235" height="77" rx="11" fill="#e7d6b5"/><text x="1039" y="130">大夏</text>
  </g>
  <g stroke="#675f55" stroke-width="4" fill="none">
    <path d="M278 122 H326"/><path d="M572 122 H620"/><path d="M866 122 H914"/>
  </g>
  <g fill="#675f55">
    <path d="M327 122 l-13 -8 v16 z"/><path d="M621 122 l-13 -8 v16 z"/><path d="M915 122 l-13 -8 v16 z"/>
  </g>
  <text x="40" y="206" font-family="sans-serif" font-size="18" fill="#594e45">箭头只表示《史记》叙述的先后；位置、距离、路线均未经核定。</text>
</svg>
